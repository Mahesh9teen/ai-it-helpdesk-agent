openapi: 3.1.0
info:
  title: AI IT Helpdesk Agent
  description: AI IT Helpdesk Agent backend with chat, ticketing, and HR request APIs.
  version: 0.1.0
paths:
  /api/v1/chat/message:
    post:
      tags:
      - Chat
      summary: Send a message to the helpdesk agent
      description: Accept a chat message and return the agent response.
      operationId: send_message_api_v1_chat_message_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat/stream:
    get:
      tags:
      - Chat
      summary: Stream assistant response as server-sent events
      description: Stream token-by-token chat responses for frontend consumption over
        SSE.
      operationId: stream_message_api_v1_chat_stream_get
      parameters:
      - name: message
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Message
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Session Id
      - name: employee_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a user and issue a JWT
      description: Authenticate a user with email and password.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Return the current authenticated user
      description: Return the active user profile for the current request.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Invalidate the current session
      description: Log the current user out of the active session.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/password-reset/initiate:
    post:
      tags:
      - Password Reset
      summary: Request a secure password reset
      description: Start the password reset flow for a user account.
      operationId: initiate_api_v1_password_reset_initiate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/password-reset/verify:
    post:
      tags:
      - Password Reset
      summary: Verify a password reset token
      description: Finalize a password reset using the supplied token.
      operationId: verify_api_v1_password_reset_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/leave/balance/{employee_id}:
    get:
      tags:
      - Leave
      summary: Get the current leave balance
      description: Return the employee leave balance.
      operationId: balance_api_v1_leave_balance__employee_id__get
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveBalanceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/leave/history/{employee_id}:
    get:
      tags:
      - Leave
      summary: Get leave history
      description: Return leave history for an employee.
      operationId: history_api_v1_leave_history__employee_id__get
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveHistoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets:
    post:
      tags:
      - Tickets
      summary: Create an IT support ticket
      description: Create a new helpdesk ticket.
      operationId: create_api_v1_tickets_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Tickets
      summary: List tickets for an employee
      description: List tickets optionally filtered by employee ID.
      operationId: read_many_api_v1_tickets_get
      parameters:
      - name: employee_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}:
    get:
      tags:
      - Tickets
      summary: Fetch a ticket by ID
      description: Retrieve a single ticket by identifier.
      operationId: read_api_v1_tickets__ticket_id__get
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/status:
    patch:
      tags:
      - Tickets
      summary: Update a ticket status
      description: Update the ticket lifecycle status.
      operationId: update_status_api_v1_tickets__ticket_id__status_patch
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketStatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/escalate:
    post:
      tags:
      - Tickets
      summary: Escalate a ticket to a human agent
      description: Escalate a ticket for human review.
      operationId: escalate_api_v1_tickets__ticket_id__escalate_post
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/software/catalog:
    get:
      tags:
      - Software Requests
      summary: Get the approved software catalog
      description: Return the pre-approved software catalog.
      operationId: catalog_api_v1_software_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareCatalogResponse'
  /api/v1/software/request:
    post:
      tags:
      - Software Requests
      summary: Submit a software request
      description: Create a software procurement or access request.
      operationId: request_api_v1_software_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftwareRequestCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/software/request/{request_id}/status:
    get:
      tags:
      - Software Requests
      summary: Get software request status
      description: Retrieve the status for a software request.
      operationId: request_status_api_v1_software_request__request_id__status_get
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareRequestStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/escalation/handoff:
    post:
      tags:
      - Escalation
      summary: Hand off a session to a human agent
      description: Create an escalation record for urgent attention.
      operationId: handoff_api_v1_escalation_handoff_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationCreateRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/escalation/queue:
    get:
      tags:
      - Escalation
      summary: List escalations waiting in the queue
      description: Return the current escalation queue.
      operationId: queue_api_v1_escalation_queue_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationQueueResponse'
  /health:
    get:
      tags:
      - Health
      summary: Check service health
      description: Return a minimal health response for orchestration and smoke tests.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /:
    get:
      tags:
      - Health
      summary: Service landing response
      description: Return a lightweight landing message for humans and probes.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    AuthLoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: AuthLoginRequest
    AuthTokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
      additionalProperties: false
      type: object
      required:
      - access_token
      title: AuthTokenResponse
    ChatMessageRequest:
      properties:
        session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Session Id
        message:
          type: string
          maxLength: 10000
          minLength: 1
          title: Message
        employee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
      additionalProperties: false
      type: object
      required:
      - message
      title: ChatMessageRequest
    ChatMessageResponse:
      properties:
        session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Session Id
        response:
          type: string
          title: Response
        intent:
          type: string
          title: Intent
          default: unknown
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 0.0
        citations:
          items:
            type: string
          type: array
          title: Citations
        sources:
          items:
            $ref: '#/components/schemas/SourceDocument'
          type: array
          title: Sources
      additionalProperties: false
      type: object
      required:
      - response
      title: ChatMessageResponse
    CurrentUserResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        email:
          type: string
          format: email
          title: Email
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        roles:
          items:
            type: string
          type: array
          title: Roles
        is_active:
          type: boolean
          title: Is Active
          default: true
      additionalProperties: false
      type: object
      required:
      - user_id
      - email
      title: CurrentUserResponse
    EscalationCreateRequest:
      properties:
        session_id:
          type: string
          format: uuid
          title: Session Id
        ticket_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ticket Id
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        urgency:
          type: string
          enum:
          - normal
          - high
          - critical
          title: Urgency
          default: normal
      additionalProperties: false
      type: object
      required:
      - session_id
      - reason
      title: EscalationCreateRequest
    EscalationQueueResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EscalationResponse'
          type: array
          title: Items
      additionalProperties: false
      type: object
      title: EscalationQueueResponse
    EscalationResponse:
      properties:
        escalation_id:
          type: string
          format: uuid
          title: Escalation Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        ticket_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ticket Id
        status:
          type: string
          enum:
          - queued
          - assigned
          - in_review
          - resolved
          title: Status
        assigned_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned To
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - escalation_id
      - session_id
      - status
      - message
      title: EscalationResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        service:
          type: string
          title: Service
          default: AI IT Helpdesk Agent
        version:
          type: string
          title: Version
          default: 0.1.0
      additionalProperties: false
      type: object
      title: HealthResponse
    LeaveBalanceResponse:
      properties:
        employee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
        casual_leave_days:
          type: number
          minimum: 0.0
          title: Casual Leave Days
        sick_leave_days:
          type: number
          minimum: 0.0
          title: Sick Leave Days
        earned_leave_days:
          type: number
          minimum: 0.0
          title: Earned Leave Days
        carried_over_days:
          type: number
          minimum: 0.0
          title: Carried Over Days
          default: 0
        as_of:
          type: string
          format: date
          title: As Of
      additionalProperties: false
      type: object
      required:
      - casual_leave_days
      - sick_leave_days
      - earned_leave_days
      - as_of
      title: LeaveBalanceResponse
    LeaveHistoryItemResponse:
      properties:
        history_id:
          type: string
          format: uuid
          title: History Id
        leave_type:
          type: string
          enum:
          - casual
          - sick
          - earned
          - unpaid
          title: Leave Type
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        days:
          type: number
          title: Days
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - history_id
      - leave_type
      - start_date
      - end_date
      - days
      - status
      title: LeaveHistoryItemResponse
    LeaveHistoryResponse:
      properties:
        employee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
        history:
          items:
            $ref: '#/components/schemas/LeaveHistoryItemResponse'
          type: array
          title: History
      additionalProperties: false
      type: object
      title: LeaveHistoryResponse
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - message
      title: MessageResponse
    PasswordResetConfirmRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
        new_password:
          type: string
          minLength: 12
          title: New Password
      additionalProperties: false
      type: object
      required:
      - token
      - new_password
      title: PasswordResetConfirmRequest
    PasswordResetRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
      additionalProperties: false
      type: object
      required:
      - email
      title: PasswordResetRequest
    PasswordResetResponse:
      properties:
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - message
      title: PasswordResetResponse
    SoftwareCatalogItemResponse:
      properties:
        item_id:
          type: string
          format: uuid
          title: Item Id
        software_name:
          type: string
          title: Software Name
        description:
          type: string
          title: Description
        is_preapproved:
          type: boolean
          title: Is Preapproved
          default: true
        approval_required:
          type: boolean
          title: Approval Required
          default: false
        category:
          type: string
          title: Category
          default: general
      additionalProperties: false
      type: object
      required:
      - item_id
      - software_name
      - description
      title: SoftwareCatalogItemResponse
    SoftwareCatalogResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoftwareCatalogItemResponse'
          type: array
          title: Items
      additionalProperties: false
      type: object
      title: SoftwareCatalogResponse
    SoftwareRequestCreateRequest:
      properties:
        employee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
        requester_email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Requester Email
        software_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Software Name
        justification:
          type: string
          maxLength: 2000
          minLength: 1
          title: Justification
        business_impact:
          type: string
          maxLength: 100
          title: Business Impact
          default: standard
      additionalProperties: false
      type: object
      required:
      - software_name
      - justification
      title: SoftwareRequestCreateRequest
    SoftwareRequestResponse:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        status:
          type: string
          enum:
          - requested
          - under_review
          - approved
          - rejected
          - fulfilled
          title: Status
        software_name:
          type: string
          title: Software Name
        employee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
        requester_email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Requester Email
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - request_id
      - status
      - software_name
      title: SoftwareRequestResponse
    SoftwareRequestStatusResponse:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        status:
          type: string
          enum:
          - requested
          - under_review
          - approved
          - rejected
          - fulfilled
          title: Status
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - request_id
      - status
      title: SoftwareRequestStatusResponse
    SourceDocument:
      properties:
        source_filename:
          type: string
          title: Source Filename
        category:
          type: string
          title: Category
        last_updated:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Last Updated
        header:
          anyOf:
          - type: string
          - type: 'null'
          title: Header
        page_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Content
      additionalProperties: false
      type: object
      required:
      - source_filename
      - category
      title: SourceDocument
    TicketCreateRequest:
      properties:
        employee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Employee Id
        requester_email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Requester Email
        subject:
          type: string
          maxLength: 200
          minLength: 1
          title: Subject
